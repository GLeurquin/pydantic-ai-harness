# Share one network namespace so cluster-advertised loopback addresses work
# both inside Docker and through the published ports on macOS and Linux.
x-node: &node
  image: redis:8
  healthcheck:
    test: [CMD-SHELL, 'redis-cli -p $$PORT ping | grep -q PONG']
    interval: 1s
    timeout: 2s
    retries: 30

services:
  redis-0:
    !!merge <<: *node
    environment:
      PORT: '7000'
    ports:
      - '127.0.0.1:7000-7002:7000-7002'
    command: [redis-server, --port, '7000', --cluster-enabled, 'yes', --cluster-announce-ip, '127.0.0.1', --appendonly, 'no', --save, '']
  redis-1:
    !!merge <<: *node
    network_mode: service:redis-0
    environment:
      PORT: '7001'
    command: [redis-server, --port, '7001', --cluster-enabled, 'yes', --cluster-announce-ip, '127.0.0.1', --appendonly, 'no', --save, '']
  redis-2:
    !!merge <<: *node
    network_mode: service:redis-0
    environment:
      PORT: '7002'
    command: [redis-server, --port, '7002', --cluster-enabled, 'yes', --cluster-announce-ip, '127.0.0.1', --appendonly, 'no', --save, '']
