<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLAI2 browser</title>
<style>
:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
body { max-width: 54rem; margin: 2rem auto; padding: 0 1rem; }
h1 { margin-bottom: .3rem; }
.hint { opacity: .8; }
#messages { display: grid; gap: 1rem; margin: 2rem 0; }
article { border: 1px solid #888; border-radius: .5rem; padding: 1rem; overflow-wrap: anywhere; }
article p { white-space: pre-wrap; margin-bottom: 0; }
textarea { box-sizing: border-box; width: 100%; min-height: 7rem; padding: .75rem; font: inherit; }
button { font: inherit; padding: .6rem 1.5rem; margin-top: .5rem; cursor: pointer; }
#status { min-height: 1.5rem; }
</style>
</head>
<body>
<h1>CLAI2</h1>
<p class="hint">Local browser conversation. Tools run with your permissions.</p>
<p class="hint">One conversation per server. Answers appear when a run finishes. Closing this tab does not stop a run.</p>
<section id="messages" aria-label="Conversation" role="log" aria-live="polite"></section>
<form id="chat">
<label for="prompt">Message</label>
<textarea id="prompt" required maxlength="65536" placeholder="Ask a question or describe a coding task"></textarea>
<button id="send" type="submit">Send</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<script>
const token = location.hash.slice(1);
const form = document.querySelector('#chat');
const prompt = document.querySelector('#prompt');
const send = document.querySelector('#send');
const status = document.querySelector('#status');
const messages = document.querySelector('#messages');
function append(label, text) {
  const article = document.createElement('article');
  const heading = document.createElement('strong');
  heading.textContent = label;
  const content = document.createElement('p');
  content.textContent = text;
  article.append(heading, content);
  messages.append(article);
}
if (!token) {
  status.textContent = 'Open the complete private URL printed by clai2 --web.';
  send.disabled = true;
}
form.addEventListener('submit', async event => {
  event.preventDefault();
  const text = prompt.value;
  if (!text.trim() || send.disabled) return;
  send.disabled = true;
  prompt.disabled = true;
  status.textContent = 'Running...';
  append('You', text);
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
      body: JSON.stringify({text})
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Request failed');
    append('CLAI2', result.output);
    prompt.value = '';
    status.textContent = 'Ready';
  } catch (error) {
    status.textContent = `${error.message}. Your draft is retained; retrying may repeat tool side effects.`;
  } finally {
    send.disabled = false;
    prompt.disabled = false;
    prompt.focus();
  }
});
</script>
</body>
</html>
