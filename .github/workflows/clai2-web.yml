name: CLAI Web

on:
  push:
    branches:
      - main
    paths:
      - 'clai2-web/**'
      - '.github/workflows/clai2-web.yml'
  pull_request:
    paths:
      - 'clai2-web/**'
      - '.github/workflows/clai2-web.yml'
  schedule:
    # Weekly mutation-testing sweep, off the PR critical path.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: >-
          Regenerate visual-regression baselines and upload them as an
          artifact instead of comparing against the committed ones. Nothing
          is committed automatically -- download the artifact and commit
          tests/visual.spec.ts-snapshots yourself.
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: clai2-web/backend
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Format
        working-directory: clai2-web/backend
        run: cargo fmt --check
      - name: Clippy
        working-directory: clai2-web/backend
        run: cargo clippy --all-targets -- -D warnings
      - name: Test with coverage
        working-directory: clai2-web/backend
        # Excludes argument wiring (main.rs) and the stub agent (bin/). The
        # three uncovered lines below 100% are I/O-failure logging branches
        # reachable only by a client-disconnect or process-death race
        # (api.rs WebSocket sends, manager.rs auto-approval response); see the
        # README. --summary-only accounting sits ~0.4% under the merged view.
        run: cargo llvm-cov --all-targets --fail-under-lines 99 --ignore-filename-regex 'src/(main\.rs|bin/)'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clai2-web/frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clai2-web/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm coverage
      - name: Build
        run: pnpm build
      - name: Build component catalog
        run: pnpm ladle:build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: clai2-web/backend
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clai2-web/frontend/pnpm-lock.yaml
      - name: Build backend server
        working-directory: clai2-web/backend
        run: cargo build --bins
      - name: Build frontend
        working-directory: clai2-web/frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install e2e deps
        working-directory: clai2-web/e2e
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: clai2-web/e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: clai2-web/e2e
        run: pnpm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: clai2-web/e2e/playwright-report

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: clai2-web/backend
      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants
      - name: Backend mutation sweep
        working-directory: clai2-web/backend
        run: cargo mutants --no-shuffle -j 2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clai2-web/frontend/pnpm-lock.yaml
      - name: Frontend mutation sweep
        working-directory: clai2-web/frontend
        run: pnpm install --frozen-lockfile && pnpm mutation

  # Screenshot-diffs every Ladle story. Runs inside the exact Playwright
  # Docker image the committed baselines were generated from -- rendering
  # varies by host OS/libs enough that a bare ubuntu-latest runner with
  # `playwright install` would not reproduce them pixel-for-pixel (see
  # https://playwright.dev/docs/test-snapshots). Keep this image tag in sync
  # with the @playwright/test version pinned in clai2-web/e2e/package.json.
  #
  # workflow_dispatch-only for now: no baseline has been committed yet, so
  # wiring this into push/pull_request would fail on every run until someone
  # triggers this job once with update_visual_baselines, downloads the
  # visual-baselines artifact, and commits
  # clai2-web/e2e/tests/visual.spec.ts-snapshots/. Move it next to `mutation`
  # in the schedule (or into push/pull_request) once that baseline exists.
  visual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clai2-web/frontend/pnpm-lock.yaml
      - name: Build frontend and component catalog
        working-directory: clai2-web/frontend
        run: pnpm install --frozen-lockfile && pnpm build && pnpm ladle:build
      - name: Install e2e deps
        working-directory: clai2-web/e2e
        run: pnpm install --frozen-lockfile
      - name: Generate baselines
        if: inputs.update_visual_baselines
        working-directory: clai2-web/e2e
        run: pnpm visual:update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.update_visual_baselines
        with:
          name: visual-baselines
          path: clai2-web/e2e/tests/visual.spec.ts-snapshots
      - name: Check for visual regressions
        if: "!inputs.update_visual_baselines"
        working-directory: clai2-web/e2e
        run: pnpm visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && !inputs.update_visual_baselines
        with:
          name: visual-diffs
          path: clai2-web/e2e/test-results
