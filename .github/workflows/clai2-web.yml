name: CLAI Web

on:
  push:
    branches:
      - main
    paths:
      - 'clai2-web/**'
      - '.github/workflows/clai2-web.yml'
  pull_request:
    paths:
      - 'clai2-web/**'
      - '.github/workflows/clai2-web.yml'
  schedule:
    # Weekly mutation-testing sweep, off the PR critical path.
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: clai2-web/backend
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Format
        working-directory: clai2-web/backend
        run: cargo fmt --check
      - name: Clippy
        working-directory: clai2-web/backend
        run: cargo clippy --all-targets -- -D warnings
      - name: Test with coverage
        working-directory: clai2-web/backend
        run: cargo llvm-cov --all-targets --fail-under-lines 100 --ignore-filename-regex 'src/(main\.rs|bin/)'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clai2-web/frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clai2-web/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm coverage
      - name: Build
        run: pnpm build
      - name: Build component catalog
        run: pnpm ladle:build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: clai2-web/backend
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clai2-web/frontend/pnpm-lock.yaml
      - name: Build backend server
        working-directory: clai2-web/backend
        run: cargo build --bins
      - name: Build frontend
        working-directory: clai2-web/frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install e2e deps
        working-directory: clai2-web/e2e
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: clai2-web/e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: clai2-web/e2e
        run: pnpm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: clai2-web/e2e/playwright-report

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: clai2-web/backend
      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants
      - name: Backend mutation sweep
        working-directory: clai2-web/backend
        run: cargo mutants --no-shuffle -j 2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clai2-web/frontend/pnpm-lock.yaml
      - name: Frontend mutation sweep
        working-directory: clai2-web/frontend
        run: pnpm install --frozen-lockfile && pnpm mutation
